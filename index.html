<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北捷運與景點集章紀錄地圖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title-group">
      <h1>台北集章紀錄地圖</h1>
      <span id="progressText" class="badge">已蒐集：0 處</span>
    </div>
    <div class="controls">
      <button id="exportBtn" class="btn btn-outline">匯出備份</button>
      <button id="importBtn" class="btn btn-outline">匯入備份</button>
      <input type="file" id="importFile" accept=".json" class="hidden">
      <button id="editBtn" class="btn btn-primary">編輯地圖</button>
    </div>
  </header>

  <div id="editBanner" class="banner hidden">
    <strong>編輯模式開啟中：</strong>直接在底圖的「<b>車站編號</b>」上點一下即可新增印記（再點一下該印記可取消）；拖曳空白處可移動整張地圖。
  </div>

  <!-- 北捷官方原圖互動容器 -->
  <main class="map-wrapper">
    <div class="map-toolbar">
      <div class="toolbar-tip">
        <span>提示：</span>
        <span id="modeHintText">目前為瀏覽模式（灰色標記代表已蓋章）</span>
      </div>
      <div class="zoom-btns">
        <button id="zoomOutBtn" class="btn-icon">－ 縮小</button>
        <button id="zoomResetBtn" class="btn-icon">100%</button>
        <button id="zoomInBtn" class="btn-icon">＋ 放大</button>
      </div>
    </div>

    <div id="mapViewport" class="map-viewport">
      <div id="mapCanvas" class="map-canvas">
        <img src="metrotaipeimap.jpg" alt="台北捷運路線圖" id="mrtBgImage" draggable="false">
        <div id="stationLayer" class="station-layer"></div>
      </div>
    </div>
  </main>

  <!-- 台北市其他景點集章區 -->
  <section class="custom-spots">
    <div class="section-header">
      <h2>台北市其他集章地點</h2>
      <span class="sub-hint">博物館、遊客中心、古蹟、貓空纜車等</span>
    </div>

    <div id="addSpotForm" class="add-form hidden">
      <input type="text" id="newSpotInput" placeholder="輸入新集章地點（例如：北門郵局、剝皮寮歷史街區、貓空纜車）">
      <button id="addSpotBtn" class="btn btn-primary">＋ 新增地點</button>
    </div>

    <div id="spotList" class="spot-grid"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
